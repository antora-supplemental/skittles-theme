name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
      - run: pnpm install --no-frozen-lockfile
      - name: Paint validate and tests
        run: |
          pnpm paint:validate
          pnpm test
      - name: Build site
        run: pnpm build
      - name: Contrast check (every color scheme, report-only)
        run: pnpm test:a11y --fail-on none --json=contrast-check.json
        env:
          CONTRAST_CHECK_CHROME: /usr/bin/google-chrome
      - name: Content starts at the top (real browser, every width)
        run: |
          npx http-server build/site -p 8093 -s &
          sleep 2
          BASE=http://localhost:8093 CHROME=/usr/bin/google-chrome pnpm test:layout
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
